# Fails each allocation in turn, R's and MIR's, while tools/alloc-exercise.R
# runs one section per job: the error trap's three invalid modules,
# mir_compile() through the emitter, cfunction(), mir_function(), and the
# first call of each compiler's function on the interpreter. A failed
# allocation must come back as an error, MIR's through the trap, never as a
# crash. min-target-hits is a floor under the hits measured (459 for the
# trap and 1466 for mir_compile on 2026-11-15), so a section that stopped
# reaching MIR fails.
on:
  # The sweep restarts R once per allocation, so a pull request runs it only
  # under the `full-ci` label; otherwise on dispatch.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

name: alloc-failure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  alloc-failure:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: ZUMIR_ALLOC_EXERCISE=trap R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e "library(zumir)"
      # R's own allocation errors ("Could not allocate saveds in
      # savetl_init" from order() among them), and MIR's through the trap.
      expect-pattern: "[Cc]annot allocate|[Cc]ould not allocate|[Oo]ut of memory|memory exhausted|zumir_error"
      target-pattern: "Not enough memory|no memory|MIR_init failed"
      min-target-hits: 400
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
      max-allocations: 3000

  alloc-failure-mir-compile:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: ZUMIR_ALLOC_EXERCISE=mir_compile R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e "library(zumir)"
      expect-pattern: "[Cc]annot allocate|[Cc]ould not allocate|[Oo]ut of memory|memory exhausted|zumir_error"
      target-pattern: "Not enough memory|no memory|MIR_init failed"
      min-target-hits: 1200
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
      max-allocations: 3000

  alloc-failure-cfunction:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: ZUMIR_ALLOC_EXERCISE=cfunction R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e "library(zumir)"
      expect-pattern: "[Cc]annot allocate|[Cc]ould not allocate|[Oo]ut of memory|memory exhausted|zumir_error"
      target-pattern: "Not enough memory|no memory|MIR_init failed"
      min-target-hits: 300
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
      max-allocations: 3000

  alloc-failure-mir-function:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: ZUMIR_ALLOC_EXERCISE=mir_function R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e "library(zumir)"
      expect-pattern: "[Cc]annot allocate|[Cc]ould not allocate|[Oo]ut of memory|memory exhausted|zumir_error"
      target-pattern: "Not enough memory|no memory|MIR_init failed"
      min-target-hits: 300
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
      max-allocations: 3000

  alloc-failure-interp-call:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: ZUMIR_ALLOC_EXERCISE=interp_call R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e "library(zumir)"
      expect-pattern: "[Cc]annot allocate|[Cc]ould not allocate|[Oo]ut of memory|memory exhausted|zumir_error"
      target-pattern: "Not enough memory|no memory|MIR_init failed"
      min-target-hits: 300
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
      max-allocations: 3000
