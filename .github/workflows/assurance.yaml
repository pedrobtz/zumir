# Holds .agents/assurance.md to the portfolio standard
# (pedrobtz/packages claude/shared/assurance.md): every required check is
# backed by a workflow, and every gap names an issue. Seconds; runs on every
# change, because the file it checks is Markdown the docs gate would skip.
on:
  pull_request:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    uses: pedrobtz/r-actions/.github/workflows/assurance.yml@v1
    with:
      # `warn` until Stage 1 (#3) gates pkgdown.yaml, the one job of the
      # package's own; then `fail`, as the roadmap says.
      ungated-jobs: warn
