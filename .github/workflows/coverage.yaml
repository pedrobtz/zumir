on:
  # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # On demand on main rather than on every push to it; the badge follows
  # (r-actions README, "Pushes to main").
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Decided without a runner (ci.md, Labels); the gate inside repeats it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:coverage'))
    # Pinned to a commit because it holds a write token (ci.md).
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@72ecdaf3536ed6b5984ed12815e168ee16ab8aa4 # v1.46.1
    permissions:
      contents: write
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
      # The C's own coverage: functions no test enters and conditions taken
      # one way only, in the job summary.
      native: true
      # A little under the figure, 63.9% on 2026-11-14, so a change that
      # drops coverage fails instead of moving the badge (#97).
      fail-under: 62
