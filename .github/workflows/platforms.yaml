# zumir's own per-OS checks, one job per OS: tools/ci/platform.sh runs once
# on each runner. Stage 2 adds MIR's own tests on the vendored copy, and
# Stages 3 to 5 add theirs (roadmap).
on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again, in every package at
  # once. Main is checked by the schedule below, which skips a commit it has
  # already checked (r-actions README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 6"

name: platforms

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  platforms:
    # Decided without a runner (ci.md, Labels); the gate inside repeats it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:platforms'))
    uses: pedrobtz/r-actions/.github/workflows/platforms.yml@v1
    with:
      profile: auto
      # The script builds MIR without R and never reads R/, man/ or
      # tests/testthat, so an R-only change skips it.
      skip-r-only: true
