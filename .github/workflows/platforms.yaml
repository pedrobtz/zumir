# zumir's own per-OS checks, one job per runner: tools/ci/platform.sh runs
# MIR's own tests on the vendored copy, the symbol checks, and on Linux the
# build without MIR (Stage 2); Stages 3 to 5 add theirs (roadmap).
#
# macOS arm64, Windows, and Linux x86-64 and aarch64 on every pull request;
# macOS x86-64 too on the schedule and on a dispatch, so a pull request takes
# one macOS runner (ci.md). Dispatch it on a branch to see that leg:
# `gh workflow run platforms.yaml --ref <branch>`.
on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again, in every package at
  # once. Main is checked by the schedule below, which skips a commit it has
  # already checked (r-actions README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "41 8 * * 6"

name: platforms

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  platforms:
    # Decided without a runner (ci.md, Labels); the gate inside repeats it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:platforms'))
    uses: pedrobtz/r-actions/.github/workflows/platforms.yml@v1
    with:
      profile: auto
      # The script installs the package and runs its tests (the no-target
      # build), so R-only changes run it too, and it needs testthat.
      r-dependencies: true
      timeout-minutes: 30
      os: >-
        ${{ github.event_name == 'pull_request'
          && '["macos-latest", "windows-latest", "ubuntu-latest", "ubuntu-24.04-arm"]'
          || '["macos-latest", "macos-15-intel", "windows-latest", "ubuntu-latest", "ubuntu-24.04-arm"]' }}
